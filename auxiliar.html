<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Felicitaciones de Cumpleaños</title>


<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/auxiliar.css" />
</head>
<body class="bg-gradient-to-br from-purple-200 to-pink-200 font-sans min-h-screen flex justify-center p-6">
<div class="w-full max-w-xl bg-white shadow-2xl rounded-3xl p-8 backdrop-blur-lg">
<h1 class="text-4xl font-extrabold text-purple-700 text-center mb-4">🎉 ¡Sube tu Video!</h1>
<p class="text-center text-gray-700 mb-6">Comparte un video corto felicitando a la persona que cumple años.</p>


<div class="flex flex-col items-center space-y-4">
<input type="file" id="videoInput" accept="video/*" class="block" />
<button id="uploadBtn" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-xl shadow-md">
Subir Video
</button>
<p id="status" class="text-gray-700"></p>
</div>


<h2 class="text-2xl font-bold text-purple-700 mt-10">📽️ Videos Recibidos</h2>
<div id="videoList" class="mt-4 space-y-6"></div>
</div>

<!-- Firebase SDK v8 (COMPATIBLE con tu código) -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>


<script src="js/FireBase-Config.js"></script>
<script src="js/app.js"></script>
</body>

</html>
