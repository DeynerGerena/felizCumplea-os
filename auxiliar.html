<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Videos - Feliz Cumpleaños</title>
  <link rel="stylesheet" href="css/auxiliar.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div id="wrapper-aux">
    <!-- Decoraciones tipo index (usa tus assets) -->
    <div class="flag__birthday small">
      <img src="assets/1.png" class="flag__left" alt="">
      <img src="assets/1.png" class="flag__right" alt="">
    </div>

    <header class="hero">
      <div class="hero-left">
        <h1 class="title-main">Videos para <span>Catalina</span></h1>
        <p class="subtitle">Sube tus videos a la carpeta de Drive "video cumpleaños" y se mostrarán aquí.</p>
      </div>
      <div class="hero-right">
        <a href="index.html" class="btn back"><i class="fa-solid fa-arrow-left"></i> Volver</a>
      </div>
    </header>

    <main class="content">
      <section id="videoGallery" class="gallery">
        <!-- JS inyecta aquí las tarjetas -->
      </section>

      <div id="emptyMessage" class="empty">No hay videos visibles todavía. Asegúrate que la carpeta y los archivos sean públicos.</div>
    </main>

    <!-- Modal de reproducción -->
    <div id="videoModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-content" role="dialog" aria-modal="true">
        <button id="closeModal" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
        <div class="video-wrapper">
          <video id="playerVideo" controls playsinline controlsList="nodownload"></video>
        </div>
        <h3 id="playerTitle" class="player-title"></h3>
      </div>
    </div>

    <!-- decorativos -->
    <div class="decorate_flower--one"><img src="assets/decorate_flower.png" alt=""></div>
    <div class="decorate_bottom"><img src="assets/decorate.png" alt=""></div>
  </div>

  <script src="js/auxiliar.js"></script>
</body>
</html>
